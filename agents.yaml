# Agent spec for DigitalOcean Managed Agents (flat agents.yaml format).
#
#   doctl harness-runtime validate agents.yaml
#   doctl harness-runtime create agents.yaml

name: langgraph-memory-test     # session names are unique per team
agent: langgraph
template: langgraph
size: mars-2vcpu-4gb

langgraph:
  framework:
    repo: https://github.com/gane5hvarma/langgraph-memory-test.git
    repo_sha: "78dd752b93022131fd9646bb6b1643870adf2fc6"        # a pushed commit that has langgraph.json

# Optional: without these the agent answers without a model, which is enough
# for the memory test. Uncomment both blocks to chat with a model, and pass
# --secret HARNESS_INFERENCE_API_KEY=@path at create.
# env:
#   HARNESS_INFERENCE_BASE_URL: https://inference.do-ai.run/v1
#   HARNESS_INFERENCE_MODEL: anthropic-claude-4.5-sonnet
# secrets:
#   HARNESS_INFERENCE_API_KEY:
#     source: tenantSecret

# Optional: attach the Action Gateway for the /tools test. The selection is
# advertised to the graph directly (up to 10 tools); change it on the running
# session with a PATCH to test a live tools update.
# tools:
#   - do.actions: [web_search]

# Optional: a Notion toolbelt for /notion (use your toolbelt's name and
# version, in place of the do.actions entry above). Put NOTION_PAGE_ID in the
# env block above if you use both.
# tools:
#   - do.actions: ["toolbelt:notion@1"]
# env:
#   NOTION_PAGE_ID: https://www.notion.so/My-test-page-0123456789abcdef0123456789abcdef
